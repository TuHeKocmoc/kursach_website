[project]
name = "btcforecastpdt"
version = "0.1.1"
authors = [
    {name = "Danila Riazanov",email = "deryazanov@edu.hse.ru"}
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "yfinance (>=1.4.1,<2.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "uvicorn[standard] (>=0.48.0,<0.49.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "xgboost (>=3.2.0,<4.0.0)",
    "torch (>=2.12.0,<3.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
